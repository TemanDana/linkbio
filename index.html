<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teman Dana Finance - Solusi Dana Tunai</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #1A365D;   /* Primer 60% */
            --gold: #FBBF24;   /* Sekunder 30% */
            --blue: #60A5FA;   /* Aksen 10% */
            --white: #FFFFFF;  /* Netral */
            --bg: #F8FAFC;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center;
        }

        .container { 
            width: 100%; 
            max-width: 450px; 
            text-align: center; 
        }

        .header { margin-bottom: 30px; }
        .header h1 { color: var(--navy); font-size: 24px; margin-bottom: 5px; }
        .header p { color: var(--blue); font-size: 14px; font-weight: 600; margin-top: 0; }

        /* Gaya Tombol Link Bio */
        .link-buttons { margin-bottom: 40px; }
        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--white);
            color: var(--navy);
            border: 2px solid var(--navy);
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            transition: 0.3s;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .btn-link:hover {
            background: var(--navy);
            color: var(--white);
        }
        .btn-ig { border-color: #E1306C; color: #E1306C; } /* Warna IG */
        .btn-ig:hover { background: #E1306C; color: white; border-color: #E1306C; }

        /* Gaya Form */
        .card-form { 
            background: var(--navy); 
            padding: 25px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(26, 54, 93, 0.2);
            text-align: left;
            color: var(--white);
        }
        .card-form h3 { 
            text-align: center; 
            color: var(--gold); 
            margin-top: 0; 
            font-size: 20px;
        }
        
        label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: var(--blue); }
        input, select, textarea { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 15px; 
            border: none; 
            border-radius: 8px; 
            background: #f0f4f8;
            font-size: 14px;
        }
        
        .btn-submit { 
            width: 100%; 
            padding: 15px; 
            background-color: var(--gold); 
            color: var(--navy); 
            border: none; 
            border-radius: 10px; 
            font-size: 16px; 
            cursor: pointer; 
            font-weight: 800;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .btn-submit:hover { 
            background-color: #eab308; 
            transform: translateY(-2px);
        }

        .footer { margin-top: 30px; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Teman Dana Finance</h1>
        <p>Solusi Cepat Jaminan BPKB</p>
    </div>

    <div class="link-buttons">
        <a href="https://wa.me/6287765791795" class="btn-link">Chat WhatsApp Langsung</a>
        <a href="https://instagram.com/temandanafinance" class="btn-link btn-ig">Follow Instagram @temandanafinance</a>
    </div>

    <div class="card-form">
        <h3>Form Pengajuan Dana</h3>
        <form id="gadaiForm">
            <label>NAMA LENGKAP</label>
            <input type="text" id="nama" placeholder="Masukkan nama Anda" required>

            <label>JENIS KENDARAAN</label>
            <select id="jenis">
                <option value="Mobil">Mobil</option>
                <option value="Motor">Motor</option>
            </select>

            <label>MERK & TAHUN</label>
            <input type="text" id="merk" placeholder="Contoh: Honda HRV 2020" required>

            <label>DOMISILI</label>
            <input type="text" id="kota" placeholder="Contoh: Jakarta" required>

            <button type="button" class="btn-submit" onclick="kirimWA()">Ajukan Sekarang</button>
        </form>
    </div>

    <div class="footer">
        © 2024 Teman Dana Finance. All rights reserved.
    </div>
</div>

<script>
    function kirimWA() {
        const noAdmin = "6287765791795"; 
        
        const nama = document.getElementById('nama').value;
        const jenis = document.getElementById('jenis').value;
        const merk = document.getElementById('merk').value;
        const kota = document.getElementById('kota').value;

        if(!nama || !merk || !kota) {
            alert("Mohon lengkapi data formulir.");
            return;
        }

        const text = `Halo Admin *Teman Dana Finance*, saya ingin mengajukan Gadai BPKB.%0A%0A` +
                     `*Data Pengajuan:*%0A` +
                     `• Nama: ${nama}%0A` +
                     `• Unit: ${jenis} ${merk}%0A` +
                     `• Lokasi: ${kota}%0A%0A` +
                     `Mohon info estimasi pencairannya ya.`;

        window.open(`https://wa.me/${noAdmin}?text=${text}`, '_blank');
    }
</script>

</body>
</html>
